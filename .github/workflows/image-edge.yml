name: Build edge image

# Publishes ghcr.io/<owner>/grampsweb:edge - the patched frontend baked into the
# patched backend image built by gramps-web-api's edge workflow.

on:
  push:
    branches:
      - edge
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/grampsweb
  WEBAPI_IMAGE: ghcr.io/${{ github.repository_owner }}/gramps-web-api:edge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up tools
        uses: jdx/mise-action@v4

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.edge
          build-args: |
            WEBAPI_IMAGE=${{ env.WEBAPI_IMAGE }}
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:edge-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
